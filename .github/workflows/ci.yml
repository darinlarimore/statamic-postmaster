name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: composer install --no-interaction --prefer-dist
      - run: ./vendor/bin/pint --test

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        statamic: ['^5.74', '^6.0']
    name: "test (statamic ${{ matrix.statamic }})"
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: composer require "statamic/cms:${{ matrix.statamic }}" --no-interaction --prefer-dist --with-all-dependencies
      - run: ./vendor/bin/pest
